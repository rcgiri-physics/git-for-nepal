# Order of the printed book. Paths are relative to docs/en/.
# Each part has a title and a list of chapters; a chapter is a path, or {path, title, level}
# (level 2 = indented under the previous chapter in the table of contents).
title: "Teaching Version Control"
subtitle: "A Foundation Book for Grades 8–12"
series: "Git for Nepal"
edition: "Edition 0.2 · October 2026"
authors: "Ram Chandra Giri and contributors"
licence: "Text CC BY 4.0 · Code and templates MIT"
site_url: "https://rcgiri-physics.github.io/git-for-nepal/"
repo_url: "https://github.com/rcgiri-physics/git-for-nepal"
output: book/dist/git-for-nepal-book.pdf

front:
  - book/index.md

parts:
  - title: "Part I. Teaching Version Control as a Foundation"
    chapters:
      - book/teaching-foundation.md
      - teachers/index.md
      - teachers/training-outline.md
      - teachers/setup.md

